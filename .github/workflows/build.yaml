name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install dependencies and run tests
        run: |
          npm run plugin:check
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run test:smoke
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/varmi5/fitness-tracker:latest
            ghcr.io/varmi5/fitness-tracker:${{ github.sha }}
      - name: Queue the Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --max-time 30 \
            --request POST --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$COOLIFY_WEBHOOK")
          if [[ "$status" != 2?? ]]; then
            echo "Coolify returned HTTP $status."
            exit 1
          fi
          if ! deployment=$(jq -er '.deployments[]?.deployment_uuid | strings | select(test("^[a-z0-9-]+$"))' "$response" 2>/dev/null); then
            echo "Coolify did not queue a deployment."
            exit 1
          fi
          echo "Coolify deployment queued: $deployment"
