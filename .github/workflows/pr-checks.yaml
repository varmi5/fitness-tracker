name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard against unapproved SQL or schema changes
        if: ${{ !contains(join(github.event.pull_request.labels.*.name, ','), 'allow-schema-change') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- migrations/ lib/schema.ts)
          if [ -n "$changed" ]; then
            echo "This PR modifies database migrations or schema files:"
            echo "$changed"
            echo "Please revert SQL/schema changes or open an Issue to request maintainer approval (allow-schema-change label)."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Check package, tests, build and authenticated MCP smoke
        run: |
          npm run plugin:check
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run test:smoke
